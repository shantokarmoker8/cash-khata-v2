<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Login - Cash Khata</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="./assets/logo.png">
<link rel="apple-touch-icon" href="./assets/logo.png">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Poppins', sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #2563eb 0%, #1e40af 50%, #1e3a8a 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    position: relative;
    overflow: hidden;
  }

  body::before {
    content: '';
    position: absolute;
    width: 500px;
    height: 500px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 50%;
    top: -150px;
    right: -150px;
  }

  body::after {
    content: '';
    position: absolute;
    width: 350px;
    height: 350px;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 50%;
    bottom: -100px;
    left: -100px;
  }

  .login-wrapper {
    width: 100%;
    max-width: 400px;
    position: relative;
    z-index: 1;
  }

  .login-card {
    background: #ffffff;
    border-radius: 20px;
    padding: 40px 32px;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
  }

  .logo-box {
    width: 80px;
    height: 80px;
    margin: 0 auto 16px;
    border-radius: 20px;
    background: linear-gradient(135deg, #2563eb, #1e40af);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.5);
  }

  .logo-box img {
    width: 48px;
    height: 48px;
    object-fit: contain;
  }

  .logo-box i {
    font-size: 34px;
    color: #ffffff;
  }

  .brand-title {
    text-align: center;
    font-weight: 700;
    font-size: 24px;
    color: #1e293b;
    margin-bottom: 4px;
  }

  .brand-subtitle {
    text-align: center;
    font-size: 13px;
    color: #94a3b8;
    margin-bottom: 32px;
  }

  .form-label {
    font-weight: 500;
    font-size: 13px;
    color: #475569;
    margin-bottom: 6px;
  }

  .input-group-custom {
    position: relative;
    margin-bottom: 20px;
  }

  .input-group-custom i {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: #94a3b8;
    font-size: 15px;
  }

  .form-control-custom {
    width: 100%;
    padding: 13px 16px 13px 44px;
    border: 1.5px solid #e2e8f0;
    border-radius: 12px;
    font-size: 14px;
    font-family: 'Poppins', sans-serif;
    transition: all 0.2s ease;
    background: #f8fafc;
  }

  .form-control-custom:focus {
    outline: none;
    border-color: #2563eb;
    background: #ffffff;
    box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
  }

  .toggle-password {
    position: absolute;
    right: 16px;
    left: auto;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: #94a3b8;
    font-size: 15px;
  }

  .btn-login {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #2563eb, #1e40af);
    color: #ffffff;
    font-weight: 600;
    font-size: 15px;
    font-family: 'Poppins', sans-serif;
    margin-top: 8px;
    transition: all 0.2s ease;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-login:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.5);
  }

  .btn-login:disabled {
    opacity: 0.7;
    transform: none;
    cursor: not-allowed;
  }

  .footer-text {
    text-align: center;
    margin-top: 24px;
    font-size: 12px;
    color: #cbd5e1;
  }

  .spinner-border-sm {
    width: 16px;
    height: 16px;
  }
</style>
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">
    <div class="logo-box">
      <img src="./assets/logo.png" alt="Cash Khata" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
      <i class="fa-solid fa-cash-register" style="display:none;"></i>
    </div>
    <div class="brand-title">Cash Khata</div>
    <div class="brand-subtitle">Sign in to manage your shop</div>

    <form id="loginForm" autocomplete="off">
      <div>
        <label class="form-label">Username</label>
        <div class="input-group-custom">
          <i class="fa-solid fa-user"></i>
          <input type="text" class="form-control-custom" id="username" placeholder="Enter username" required autocomplete="off">
        </div>
      </div>

      <div>
        <label class="form-label">Password</label>
        <div class="input-group-custom">
          <i class="fa-solid fa-lock"></i>
          <input type="password" class="form-control-custom" id="password" placeholder="Enter password" required autocomplete="off">
          <i class="fa-solid fa-eye toggle-password" id="togglePassword"></i>
        </div>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        <span id="btnText">Login</span>
      </button>
    </form>

    <div class="footer-text">&copy; <span id="year"></span> Cash Khata. All rights reserved.</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script type="module">
  import { getAllDocs } from './js/db-helpers.js';
  import { setSession, isLoggedIn } from './js/auth-guard.js';

  document.getElementById('year').textContent = new Date().getFullYear();

  // ইতোমধ্যে লগইন করা থাকলে সরাসরি dashboard এ পাঠিয়ে দাও
  if (isLoggedIn()) {
    window.location.href = 'dashboard.html';
  }

  const togglePassword = document.getElementById('togglePassword');
  const passwordInput = document.getElementById('password');
  togglePassword.addEventListener('click', () => {
    const isHidden = passwordInput.type === 'password';
    passwordInput.type = isHidden ? 'text' : 'password';
    togglePassword.classList.toggle('fa-eye');
    togglePassword.classList.toggle('fa-eye-slash');
  });

  const loginForm = document.getElementById('loginForm');
  const loginBtn = document.getElementById('loginBtn');
  const btnText = document.getElementById('btnText');

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (!username || !password) {
      Swal.fire({
        icon: 'warning',
        title: 'Missing Fields',
        text: 'Please enter both username and password.',
        confirmButtonColor: '#2563eb'
      });
      return;
    }

    loginBtn.disabled = true;
    btnText.innerHTML = '<span class="spinner-border spinner-border-sm" role="status"></span> Signing in...';

    try {
      // users কালেকশনের সব ডকুমেন্ট এনে username/password ম্যাচ করা হচ্ছে
      const allUsers = await getAllDocs('users', 'username', 'asc');
      const matchedUser = allUsers.find(
        (u) => u.username === username && u.password === password
      );

      if (!matchedUser) {
        Swal.fire({
          icon: 'error',
          title: 'Login Failed',
          text: 'Invalid username or password.',
          confirmButtonColor: '#2563eb'
        });
        loginBtn.disabled = false;
        btnText.textContent = 'Login';
        return;
      }

      setSession({
        uid: matchedUser.id,
        username: matchedUser.username,
        full_name: matchedUser.full_name,
        role: matchedUser.role,
        language: matchedUser.language || 'en'
      });

      Swal.fire({
        icon: 'success',
        title: 'Welcome back!',
        text: matchedUser.full_name,
        timer: 1000,
        showConfirmButton: false
      }).then(() => {
        window.location.href = 'dashboard.html';
      });

    } catch (err) {
      console.error(err);
      Swal.fire({
        icon: 'error',
        title: 'Connection Error',
        text: 'Could not connect to the server. Please check your internet connection.',
        confirmButtonColor: '#2563eb'
      });
      loginBtn.disabled = false;
      btnText.textContent = 'Login';
    }
  });
</script>

</body>
</html>
